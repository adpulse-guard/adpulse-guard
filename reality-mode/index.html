<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AdPulse Guard · Reality Mode™</title>

  <style>
    :root {
      --apg-bg: #0c1224;
      --apg-card: #1b2335;
      --apg-primary: #9b57fa;
      --apg-primary-soft: #a9a4ff;
      --apg-text: #f6f8ff;
      --apg-muted: #aab9d6;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      background:
        radial-gradient(
          1200px 600px at top,
          #1d2947,
          var(--apg-bg)
        );

      color: var(--apg-text);

      padding: 8px 20px 16px;

      max-width: 720px;

      margin: 0 auto;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 4px 10px;
      padding: 8px 12px;
      border-radius: 12px;
      background: linear-gradient(100deg,rgba(20,141,255,0.07),rgba(155,87,250,0.08));
    }

    .brand-row img {
      width: 30px;
      height: 30px;
      opacity: 0.85;

      filter:
        drop-shadow(
          0 0 10px
          rgba(48,146,255,0.35)
        )
        drop-shadow(
          0 0 24px
          rgba(155,87,250,0.22)
        );
    }

    .box {
      backdrop-filter: blur(6px);

      background:
        linear-gradient(
          180deg,
          rgba(155,87,250,0.055),
          rgba(255,255,255,0)
        );

      background-color: var(--apg-card);

      padding: 8px 28px 12px;

      border-radius: 16px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.04);

      border:
        1px solid rgba(92,117,174,0.20);
    }

    h1 {
      font-size: 24px;
      margin: 6px 0 8px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .title-row {
      position: relative;
    }

    .title-row::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 32px;

      background:
        linear-gradient(
          rgba(255,255,255,0.04) 1px,
          transparent 1px
        );

      background-size: 100% 6px;

      pointer-events: none;
    }

    .ekg {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 32px;
      margin-bottom: -8px;
    }

    .ekg svg {
      width: 100%;
      height: 32px;
      overflow: hidden;
    }

    .ekg path {
      fill: none;
      stroke: #ef4444;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;

      stroke-dasharray: 1300;
      stroke-dashoffset: 1300;

      animation:
        ekgDraw 9s linear infinite;

      filter:
        drop-shadow(
          0 0 3px
          rgba(239,68,68,0.5)
        )
        drop-shadow(
          0 0 8px
          rgba(239,68,68,0.35)
        )
        drop-shadow(
          0 0 16px
          rgba(239,68,68,0.15)
        );
    }

    @keyframes ekgDraw {
      from {
        stroke-dashoffset: 1300;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    p {
      margin-bottom: 10px;
      line-height: 1.65;
    }

    .highlight {
      color: var(--apg-primary-soft);
      font-weight: 600;
    }

    .section-title {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--apg-muted);
      margin-bottom: 8px;
    }

    .section-divider {
      border-top:
        1px solid
        rgba(255,255,255,0.08);

      margin: 18px 0;
    }

    .incident-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .incident {
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(110,125,191,0.11);
      transition: all 0.2s ease;
    }

    .incident:hover {
      background: rgba(110,125,191,0.18);
      transform: translateY(-1px);
    }

    .incident.high {
      border-left: 3px solid #ef4444;
    }

    .incident.medium {
      border-left: 3px solid #fb923c;
    }

    .incident.low {
      border-left: 3px solid #facc15;
    }

    .incident-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .incident-desc {
      font-size: 13px;
      color: var(--apg-muted);
    }

    .incident-affected {
      font-size: 11px;
      color: var(--apg-muted);
      opacity: 0.75;
      margin-top: 4px;
    }

    .score-good {
      color: #4ade80;
      font-weight: 600;
    }

    .score-mid {
      color: #facc15;
      font-weight: 600;
    }

    .score-bad {
      color: #fb923c;
      font-weight: 600;
    }

    .score-critical {
      color: #f87171;
      font-weight: 700;
    }

    .revenue-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(239,68,68,0.15);
      color: #f87171;
      font-weight: 600;
      margin-top: 8px;
    }

    .quote {
      margin: -12px 0 0;
      font-style: italic;
      color: var(--apg-muted);
      white-space: pre-line;
    }

    .dashboard-area {
      margin-top: 6px;
      font-size: 13px;
      color: var(--apg-muted);
    }

    .dashboard-link {
      color: var(--apg-primary-soft);
      text-decoration: none;

      border-bottom:
        1px dashed
        rgba(143,161,255,0.60);
    }

    .dashboard-link:hover {
      color: #c7b7ff;
      border-bottom-color: #c7b7ff;
    }

    .footer {
      margin-top: 8px;
      opacity: 0.6;
      text-align: center;
    }

    .footer hr {
      border: none;

      border-top:
        1px solid
        rgba(255,255,255,0.08);

      margin: 0 0 6px;
    }

    .fade {
      font-size: 13px;
      color: var(--apg-muted);
    }

    .loading-screen {
  min-height: 260px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  color: var(--apg-muted);
}

.loading-logo {
  width: 42px;
  height: 42px;

  margin-bottom: 14px;

  opacity: 0.9;

  filter:
    drop-shadow(
      0 0 10px
      rgba(48,146,255,0.35)
    )
    drop-shadow(
      0 0 24px
      rgba(155,87,250,0.22)
    );
}

.loading-title {
  font-size: 18px;
  font-weight: 600;

  color: var(--apg-text);

  margin-bottom: 10px;
}

.loading-ekg {
  width: 220px;
  height: 40px;

  margin-bottom: 8px;
}

.loading-ekg svg {
  width: 100%;
  height: 40px;
}

.loading-ekg path {
  fill: none;
  stroke: #ef4444;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;

  stroke-dasharray: 500;
  stroke-dashoffset: 500;

  animation:
    loadingEkg 2s linear infinite;

  filter:
    drop-shadow(
      0 0 4px
      rgba(239,68,68,0.5)
    );
}

@keyframes loadingEkg {
  from {
    stroke-dashoffset: 500;
  }

  to {
    stroke-dashoffset: 0;
  }
}

.loading-text {
  font-size: 13px;
  opacity: 0.75;
}
  </style>
</head>

<body>

  <div id="app">
  <div class="loading-screen">

    <img
      src="https://adpulse-guard.github.io/adpulse-guard/Logo%20Shield.png"
      alt="AdPulse Guard"
      class="loading-logo"
    />

    <div class="loading-title">
      Reality Mode™
    </div>

    <div class="loading-ekg">
      <svg
        viewBox="0 0 300 40"
        preserveAspectRatio="none"
      >
        <path
          d="M0 20 L45 20 L58 20 L68 34 L78 6 L88 28 L110 20 L145 20 L158 32 L170 8 L182 26 L205 20 L250 20 L300 20"
        />
      </svg>
    </div>

    <div class="loading-text">
      Reviewing the damage...
    </div>

  </div>
</div>


  <script>
    const params =
      new URLSearchParams(window.location.search);

    const token =
      params.get('token');

    const date =
      params.get('date') || '';

    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbyNw8nR6WqMWH5rEdXz3AkpVNNR-fpzDLG-nGgN9nTfeDWHpxDz1of7RCuHMltR56XXCg/exec';


    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    if (!token) {

      document.getElementById('app').innerHTML = `
        <div class="box">
          Missing or invalid Reality token.
        </div>
      `;

    } else {

      const realityParams =
        new URLSearchParams();

      realityParams.set(
        'view',
        'reality-data'
      );

      realityParams.set(
        'token',
        token
      );

      realityParams.set(
        'date',
        date
      );

      const realityKeys = [
        'slots',
        'issues',
        'loss',
        'gptScriptMissing',
        'gptNotInitialized',
        'gptNoSlotRequests',
        'domFail',
        'requestedMissingDom',
        'requestedMissingDomHigh',
        'requestedMissingDomMedium',
        'noDomNoRequest',
        'neverRequested',
        'containerCollapsed',
        'wrongNetwork',
        'emptyResponse',
        'unexpectedSize',
        'layoutOverlap',
        'visibilityImpaired',
        'slotImpacts'
      ];

      realityKeys.forEach(key => {
        const value =
          params.get(key);
        if (value !== null) {
          realityParams.set(key, value);
        }
      });

      const realityDataUrl =
        `${APPS_SCRIPT_URL}?${realityParams.toString()}`;

      fetch(realityDataUrl)

        .then(response =>
          response.json()
        )

        .then(data => {

          if (!data.ok) {
            throw new Error(
              data.error ||
              'Reality data unavailable'
            );
          }


          let incidentsHtml = '';


          if (
            !data.incidents ||
            data.incidents.length === 0
          ) {

            incidentsHtml = `
              <div class="section-title">
                All quiet... suspiciously.
              </div>

              <div class="incident">

                <div class="incident-title">
                  😌 No incidents detected
                </div>

                <div class="incident-desc">
                  Enjoy it while it lasts.
                </div>

              </div>
            `;

          } else {

            incidentsHtml = `
  <div class="section-title">
    ${escapeHtml(data.incidentHeader)}
  </div>

  <div class="incident-list">
`;


            data.incidents.forEach(
              incident => {

                incidentsHtml += `
                  <div
                    class="incident ${escapeHtml(incident.severity)}"
                  >

                    <div class="incident-title">

                      ${escapeHtml(incident.emoji)}

                      ${escapeHtml(incident.count)}

                      ${escapeHtml(incident.title)}

                    </div>

                    <div class="incident-desc">

                      ${escapeHtml(incident.message)}

                    </div>

                    ${Number.isInteger(Number(incident.affectedSlots)) &&
                      Number(incident.affectedSlots) > 0
                        ? `
                  <div class="incident-affected">
                    Affects ${escapeHtml(incident.affectedSlots)}
                    ${Number(incident.affectedSlots) === 1 ? 'slot' : 'slots'}
                  </div>
                    `
                    : ''
                }

                  </div>
                `;

              }
            );


            incidentsHtml += `
              </div>
            `;
          }


          const revenueHtml =
            Number(data.loss) > 0
              ? `
                <div class="revenue-badge">
                  Revenue exposure
                  $${Number(data.loss).toFixed(2)}/day
                </div>
              `
              : '';


          const moodHtml =
            Number(data.issues) > 0
              ? `
                <div class="section-divider" style="margin:12px 0 10px;">
                  </div>

                <p style="opacity:0.85; margin:0;">
                  AdPulse mood today:
                  ${escapeHtml(data.mood)}
                </p>
              `
              : '';


          document
            .getElementById('app')
            .innerHTML = `

              <div class="brand-row">

                <img
                  src="${escapeHtml(data.logoUrl)}"
                  alt="AdPulse Guard"
                />

                <span>

                  <strong>
                    AdPulse Guard
                  </strong>

                  <span style="opacity:0.6;">
                    · Reality Mode™
                  </span>

                </span>

              </div>


              <div class="box">

                <div class="title-row">

                  <h1>
                    ${escapeHtml(data.title)}
                  </h1>

                  <div class="ekg">

                    <svg
                      viewBox="0 0 900 40"
                      preserveAspectRatio="none"
                    >

                      <path
                        d="${escapeHtml(data.ekgPath)}"
                      />

                    </svg>

                  </div>

                </div>


                <p>
                  ${data.summaryHtml}
                </p>


                ${incidentsHtml}


                <div class="section-divider">
                </div>


                <div class="section-title">
                  System vitals
                </div>


                <div style="margin-top:6px;">

                  Pulse:

                  <span
                    class="score-${escapeHtml(data.scoreClass)}"
                  >

                    ${escapeHtml(data.pulseLabel)}
                    ·
                    ${escapeHtml(data.pulseScore)}%

                  </span>

                </div>


                ${revenueHtml}

                ${moodHtml}

              </div>


              <p class="quote">
                ${escapeHtml(data.quote)}
              </p>


              <div class="dashboard-area">

                ${escapeHtml(
                  data.dashboardCTA?.before || ''
                )}

                <a
                  class="dashboard-link"
                  href="${escapeHtml(data.dashboardLink)}"
                >

                  ${escapeHtml(
                    data.dashboardCTA?.link ||
                    'Open dashboard.'
                  )}

                </a>

              </div>


              <div class="footer">

                <hr>

                <span class="fade">
                  Never Miss a Beat.
                </span>

              </div>
            `;

        })

        .catch(error => {

          document
            .getElementById('app')
            .innerHTML = `

              <div class="box">

                <strong>
                  Reality Mode unavailable.
                </strong>

                <p>
                  ${escapeHtml(error.message)}
                </p>

              </div>
            `;

        });

    }
  </script>

</body>

</html>
