<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AdPulse Guard · Reality Mode™</title>
</head>

<body>

  <h1>Reality test</h1>

  <pre id="output">
Loading...
  </pre>

  <script>
    const params = new URLSearchParams(window.location.search);

    const token = params.get('token');
    const date = params.get('date') || '';

    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbxAD4aNij0ApHx21r68hq5TLx2k2r3VT9_obEe7I-EX_l3JGDQSnrY84LcA4QG8Ldf2ig/exec';

    if (!token) {
      document.getElementById('output').textContent =
        'Missing token.';
    } else {

      const realityParams = new URLSearchParams();

realityParams.set('view', 'reality-data');
realityParams.set('token', token);
realityParams.set('date', date);

const realityKeys = [
  'slots',
  'issues',
  'loss',
  'gptScriptMissing',
  'gptNotInitialized',
  'gptNoSlotRequests',
  'domFail',
  'requestedMissingDom',
  'noDomNoRequest',
  'neverRequested',
  'containerCollapsed',
  'wrongNetwork',
  'emptyResponse',
  'unexpectedSize',
  'layoutOverlap',
  'visibilityImpaired'
];

realityKeys.forEach(key => {
  const value = params.get(key);

  if (value !== null) {
    realityParams.set(key, value);
  }
});

const realityDataUrl =
  `${APPS_SCRIPT_URL}?${realityParams.toString()}`;

      fetch(realityDataUrl)
        .then(response => response.json())
        .then(data => {

          document.getElementById('output').textContent =
            JSON.stringify(data, null, 2);

        })
        .catch(error => {

          document.getElementById('output').textContent =
            'Reality data error: ' + error;

        });

    }
  </script>

</body>

</html>
