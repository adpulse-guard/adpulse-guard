<script>
  if (localStorage.getItem('theme') === 'dark') {
  document.documentElement.classList.add('dark');
}
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: { 
          darkcard: '#2a2a3b',

</script>
<style>
/* SCROLLBAR – global */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: #f1f1f1;
}

/* LIGHT */
::-webkit-scrollbar-thumb {
  background: #c7c7c7;
  border-radius: 6px;
}

/* DARK MODE */
.dark::-webkit-scrollbar-track {
  background: #1e1e2f;
}

.dark::-webkit-scrollbar-thumb {
  background: #4b4b6a;
}

.dark::-webkit-scrollbar-thumb:hover {
  background: #6366f1;
}

/* Dark mode: severity color on the left border only.
   Keep the card background transparent and the regular subtle borders. */
.dark #detailsContent .apg-incident-card {
  border-left-color: rgba(107, 114, 128, 0.88);
}
.dark #detailsContent .apg-incident-card[data-severity="HIGH"] {
  border-left-color: rgba(239, 68, 68, 0.80);
}
.dark #detailsContent .apg-incident-card[data-severity="MEDIUM"] {
  border-left-color: rgba(251, 191, 36, 0.72);
}
.dark #detailsContent .apg-incident-card[data-severity="LOW"] {
  border-left-color: #818cf8;
}
.dark #detailsContent .apg-incident-card[data-severity="INFO"] {
  border-left-color: #6b7280;
}
  /* Single-menu date picker, native light/dark, keyboard accessible. */
  .apg-date-panel { z-index: 70; }
  .apg-preset { display:block; width:100%; text-align:left; padding:10px 12px; border-radius:7px; font-size:12px; transition:background .12s; }
  .apg-preset:hover, .apg-preset:focus-visible { background:rgba(99,102,241,.10); outline:none; }
  .apg-preset.is-selected { background:rgba(99,102,241,.15); color:#4f46e5; font-weight:600; }
  .dark .apg-preset.is-selected { background:rgba(129,140,248,.20); color:#c7d2fe; }
  .apg-day { display:flex; justify-content:center; align-items:center; aspect-ratio:1/1; width:100%; border-radius:7px; font-size:12px; transition:background .12s; }
  .apg-day:hover, .apg-day:focus-visible { background:rgba(99,102,241,.17); outline:2px solid #818cf8; outline-offset:-2px; }
  .apg-day.apg-other-month { color:#9ca3af; }
  .apg-day.apg-today { box-shadow:inset 0 0 0 1px #818cf8; }
  .apg-day.apg-in-range { background:rgba(99,102,241,.13); border-radius:0; }
  .dark .apg-day.apg-in-range { background:rgba(129,140,248,.20); }
  .apg-day.apg-range-edge { background:#4f46e5; color:white; border-radius:7px; font-weight:600; }
  .dark .apg-day.apg-range-edge { background:#818cf8; color:#151528; }
  @media(max-width:767px) {
    .apg-date-panel { position:fixed !important; left:12px !important; right:12px !important; top:75px !important; width:auto !important; max-height:calc(100vh - 90px); overflow-y:auto; }
  }

<script>
function apgEscapeHtml(value) {return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function apgSafeHref(value) {try {const url=new URL(String(value));return ['http:','https:'].includes(url.protocol)?apgEscapeHtml(url.href):'#';}catch{return '#';}}
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (!token || token === 'undefined') {
  document.body.innerHTML = 'Access denied';
  throw new Error('Invalid token');
}

const overviewLink = document.getElementById('overviewLink');

const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyNw8nR6WqMWH5rEdXz3AkpVNNR-fpzDLG-nGgN9nTfeDWHpxDz1of7RCuHMltR56XXCg/exec';

let currentPageMap = new Map();
let activeDate = params.get('date') || '';
let rangeStart = activeDate ? '' : (params.get('start') || '');
let rangeEnd = activeDate ? '' : (params.get('end') || '');
const APG_RANGE_PRESETS = new Set(['all','single','today','yesterday','last7','last30','mtd','lastmonth','qtd','ytd','custom']);
let selectedRangePreset = activeDate
  ? (['today','yesterday'].includes(params.get('period')) ? params.get('period') : 'single')
  : (rangeStart && rangeEnd && APG_RANGE_PRESETS.has(params.get('period'))
    ? params.get('period') : rangeStart && rangeEnd ? 'custom'
    : params.get('period') === 'all' ? 'all' : 'today');
if (!activeDate && !rangeStart && !rangeEnd && selectedRangePreset === 'today') {
  activeDate = apgTodayUtc();
}
let selectedIssue = params.get('issue') || '';
// Consume one page deep-link after the Explorer data loads.
let pendingExplorerPage = params.get('page') || '';
function apgUtcDate(y,m,d) { return new Date(Date.UTC(y,m,d)).toISOString().slice(0,10); }
function apgTodayUtc() { return new Date().toISOString().slice(0,10); }
function apgPeriodWindow(key) {
  const today = new Date(apgTodayUtc() + 'T00:00:00Z');
  const y=today.getUTCFullYear(), m=today.getUTCMonth(), d=today.getUTCDate();
  const end=apgUtcDate(y,m,d);
  if (key==='today') return [end,end];
  if (key==='yesterday') {const date=apgUtcDate(y,m,d-1);return [date,date];}
  if (key==='last7') return [apgUtcDate(y,m,d-6),end];
  if (key==='last30') return [apgUtcDate(y,m,d-29),end];
  if (key==='mtd') return [apgUtcDate(y,m,1),end];
  if (key==='lastmonth') return [apgUtcDate(y,m-1,1),apgUtcDate(y,m,0)];
  if (key==='qtd') return [apgUtcDate(y,Math.floor(m/3)*3,1),end];
  if (key==='ytd') return [apgUtcDate(y,0,1),end];
  return ['', ''];
}
function apgSyncDateWindowToUrl() {
  const url = new URL(window.location);
  ['date','start','end','period'].forEach(key=>url.searchParams.delete(key));
  if (activeDate) url.searchParams.set('date',activeDate);
  else if (rangeStart && rangeEnd) {
    url.searchParams.set('start',rangeStart);
    url.searchParams.set('end',rangeEnd);
    url.searchParams.set('period',selectedRangePreset);
  } else if (selectedRangePreset === 'all') {
    url.searchParams.set('period','all');
  }
  if (activeDate && ['today','yesterday'].includes(selectedRangePreset))
    url.searchParams.set('period',selectedRangePreset);
  window.history.replaceState({},'',url);
}
// Dates are displayed independently from native date inputs to avoid empty
// "mm/dd/yyyy" placeholders for Today/Yesterday and preset ranges.
function apgFormatDate(dateKey, showYear = true) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey || '')) return '';
  const date = new Date(dateKey + 'T00:00:00Z');
  if (Number.isNaN(date.getTime())) return '';
  return new Intl.DateTimeFormat('en-GB', {
    day: '2-digit',
    month: 'short',
    ...(showYear ? {year: 'numeric'} : {}),
    timeZone: 'UTC'
  }).format(date);
}
function apgFormatRange(start, end) {
  if (!start || !end) return '';
  if (start === end) return apgFormatDate(start);
  const commonYear = start.slice(0,4) === end.slice(0,4);
  return apgFormatDate(start, !commonYear) + ' – ' + apgFormatDate(end);
}
const APG_PRESET_TITLES = {
  today:'Today', yesterday:'Yesterday',last7:'Last 7 days',
  last30:'Last 30 days',mtd:'Month to date',lastmonth:'Last month',
  qtd:'Quarter to date',ytd:'Year to date',all:'All time',
  single:'Single day',custom:'Custom range'
};
let apgDraftStart = '';
let apgDraftEnd = '';
let apgDraftMode = 'range';
let apgSelectSecond = false;
let apgCalendarBase = null;

function apgUpdateDateControls() {
  const title = document.getElementById('apgDateTriggerName');
  const subtitle = document.getElementById('apgDateTriggerRange');
  title.textContent = APG_PRESET_TITLES[selectedRangePreset] || 'Custom range';
  subtitle.textContent = activeDate ? apgFormatDate(activeDate) :
    rangeStart && rangeEnd ? apgFormatRange(rangeStart,rangeEnd) : '';
  document.querySelectorAll('#apgPresetList [data-period]').forEach(button => {
    const selected = button.dataset.period === selectedRangePreset;
    button.classList.toggle('is-selected',selected);
    button.setAttribute('aria-pressed',String(selected));
  });
}
function apgMonthAnchor(key) {
  const d = new Date((key || apgTodayUtc()).slice(0,7) + '-01T00:00:00Z');
  return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-1,1));
}
function apgDateKey(year,month,day) {
  return new Date(Date.UTC(year,month,day)).toISOString().slice(0,10);
}
function apgRenderOneMonth(monthOffset) {
  const base=apgCalendarBase;
  const month=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+monthOffset,1));
  const y=month.getUTCFullYear(),m=month.getUTCMonth();
  const firstDow=new Date(Date.UTC(y,m,1)).getUTCDay();
  const heading=new Intl.DateTimeFormat('en-GB',{month:'short',year:'numeric',timeZone:'UTC'}).format(month);
  const weekdays=['S','M','T','W','T','F','S'].map(d =>
    '<span class="text-center text-[10px] text-gray-400">'+d+'</span>').join('');
  // Render only the weeks touched by this month (4–6 rows), not a fixed six weeks.
  // Keep the few adjacent-month dates needed to complete the final Sunday–Saturday row.
  const daysInMonth=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const visibleCells=Math.ceil((firstDow+daysInMonth)/7)*7;
  let days='';
  for(let cell=0;cell<visibleCells;cell++){
    const day=cell-firstDow+1;
    const key=apgDateKey(y,m,day);
    const inMonth=key.slice(0,7)===apgDateKey(y,m,1).slice(0,7);
    const start=apgDraftStart,end=apgDraftEnd;
    const lo=start && end ? (start<end?start:end) : start;
    const hi=start && end ? (start>end?start:end) : end;
    const inRange=lo && hi && key>=lo && key<=hi;
    const edge=key===start || key===end;
    const isToday=key===apgTodayUtc();
    const classes=['apg-day',!inMonth?'apg-other-month':'',inRange?'apg-in-range':'',edge?'apg-range-edge':'',isToday?'apg-today':''].filter(Boolean).join(' ');
    days+='<button type="button" class="'+classes+'" data-apg-date="'+key+'" aria-label="'+apgFormatDate(key)+'" aria-pressed="'+String(Boolean(edge))+'">'+Number(key.slice(-2))+'</button>';
  }
  return '<section><h3 class="mb-3 text-center text-xs font-semibold text-gray-700 dark:text-gray-200">'+heading+'</h3><div class="grid grid-cols-7 gap-1 mb-1">'+weekdays+'</div><div class="grid grid-cols-7 gap-1">'+days+'</div></section>';
}
function apgRenderDatePanel() {
  if (!apgCalendarBase) apgCalendarBase=apgMonthAnchor(apgDraftStart);
  document.getElementById('apgCalendarMonths').innerHTML=apgRenderOneMonth(0)+apgRenderOneMonth(1);
  const dateTitle=apgDraftStart
    ? (apgDraftEnd ? apgFormatRange(apgDraftStart,apgDraftEnd) :
       apgFormatDate(apgDraftStart) + ' → Select end date')
    : 'Select dates';
  document.getElementById('apgDraftDateLabel').textContent=dateTitle;
  document.getElementById('apgCalendarHint').textContent=apgDraftMode==='single'
    ? 'Choose one date, then Apply.'
    : apgSelectSecond ? 'Choose the end date.' : 'Click a start date, then an end date.';
  document.getElementById('apgDateApply').disabled=!apgDraftStart;
}
function apgCloseDatePanel() {
  document.getElementById('apgDatePanel').classList.add('hidden');
  document.getElementById('apgDateTrigger').setAttribute('aria-expanded','false');
}
function apgOpenDatePanel() {
  apgDraftStart=activeDate || rangeStart || apgTodayUtc();
  apgDraftEnd=activeDate || rangeEnd || apgDraftStart;
  apgDraftMode='range';
  apgSelectSecond=false;
  apgCalendarBase=apgMonthAnchor(apgDraftStart);
  document.getElementById('apgDatePanel').classList.remove('hidden');
  document.getElementById('apgDateTrigger').setAttribute('aria-expanded','true');
  apgRenderDatePanel();
}
function apgSelectReportPreset(period) {
  selectedRangePreset=period;
  if(period==='all'){activeDate='';rangeStart='';rangeEnd='';}
  else if(period==='today'||period==='yesterday'){
    [activeDate]=apgPeriodWindow(period);
    rangeStart='';rangeEnd='';
  } else {
    activeDate='';
    [rangeStart,rangeEnd]=apgPeriodWindow(period);
  }
  apgApplyDateSelection();
  apgCloseDatePanel();
}
function apgInitDateRangePicker() {
  const trigger=document.getElementById('apgDateTrigger');
  const panel=document.getElementById('apgDatePanel');
  trigger.addEventListener('click',()=>{
    if(panel.classList.contains('hidden')) apgOpenDatePanel();
    else apgCloseDatePanel();
  });
  document.getElementById('apgDateCancel').addEventListener('click',apgCloseDatePanel);
  document.getElementById('apgPrevMonth').addEventListener('click',()=>{
    apgCalendarBase=new Date(Date.UTC(apgCalendarBase.getUTCFullYear(),apgCalendarBase.getUTCMonth()-1,1));
    apgRenderDatePanel();
  });
  document.getElementById('apgNextMonth').addEventListener('click',()=>{
    apgCalendarBase=new Date(Date.UTC(apgCalendarBase.getUTCFullYear(),apgCalendarBase.getUTCMonth()+1,1));
    apgRenderDatePanel();
  });
  document.getElementById('apgPresetList').addEventListener('click',e=>{
    const choice=e.target.closest('button[data-period]');
    if(!choice)return;
    const period=choice.dataset.period;
    if(period==='single'||period==='custom'){
      apgDraftMode=period==='single'?'single':'range';
      apgDraftStart=activeDate || rangeStart || apgTodayUtc();
      apgDraftEnd=period==='single'?apgDraftStart:(rangeEnd || apgDraftStart);
      apgSelectSecond=false;
      apgCalendarBase=apgMonthAnchor(apgDraftStart);
      apgRenderDatePanel();
      return;
    }
    apgSelectReportPreset(period);
  });
  document.getElementById('apgCalendarMonths').addEventListener('click',e=>{
    const day=e.target.closest('button[data-apg-date]');
    if(!day)return;
    const key=day.dataset.apgDate;
    if(apgDraftMode==='single'){
      apgDraftStart=key;apgDraftEnd=key;apgSelectSecond=false;
    }else if(!apgSelectSecond) {
      apgDraftStart=key;apgDraftEnd='';apgSelectSecond=true;
    }else{
      apgDraftEnd=key;
      if(apgDraftEnd<apgDraftStart)[apgDraftStart,apgDraftEnd]=[apgDraftEnd,apgDraftStart];
      apgSelectSecond=false;
    }
    apgRenderDatePanel();
  });
  document.getElementById('apgDateApply').addEventListener('click',()=>{
    if(!apgDraftStart)return;
    if(apgDraftMode==='single' || !apgDraftEnd || apgDraftStart===apgDraftEnd) {
      selectedRangePreset='single';
      activeDate=apgDraftStart;
      rangeStart='';rangeEnd='';
    }else{
      selectedRangePreset='custom';
      activeDate='';
      rangeStart=apgDraftStart;rangeEnd=apgDraftEnd;
    }
    apgApplyDateSelection();
    apgCloseDatePanel();
  });
  document.addEventListener('pointerdown',e=>{
    if(!document.getElementById('apgDatePicker').contains(e.target))apgCloseDatePanel();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&!panel.classList.contains('hidden')) {
      apgCloseDatePanel();
      trigger.focus();
    }
  });
}

function apgApplyDateSelection() {

}
apgUpdateDateControls();

function syncOverviewLink() {
  if (!overviewLink || !token) return;

  const url = new URL('index.html', window.location.href);

  url.searchParams.set('token', token);

  if (activeDate) {
    url.searchParams.set('date', activeDate);
    url.searchParams.delete('start'); url.searchParams.delete('end');
    if (selectedRangePreset === 'today' || selectedRangePreset === 'yesterday')
      url.searchParams.set('period', selectedRangePreset);
    else url.searchParams.delete('period');
  } else {
    url.searchParams.delete('date');
    if (rangeStart && rangeEnd) {
      url.searchParams.set('start', rangeStart);
      url.searchParams.set('end', rangeEnd);
      url.searchParams.set('period', selectedRangePreset);
    } else {
      url.searchParams.delete('start'); url.searchParams.delete('end');
      if (selectedRangePreset === 'all') url.searchParams.set('period','all');
      else url.searchParams.delete('period');
    }
  }

  if (selectedIssue) {
    url.searchParams.set('issue', selectedIssue);
  } else {
    url.searchParams.delete('issue');
  }

  overviewLink.href = url.pathname.split('/').pop() + url.search;
}

if (overviewLink) {
  overviewLink.addEventListener('click', () => {
    syncOverviewLink();
  });
}

syncOverviewLink();
const clearIssueFilterBtn = document.getElementById('clearIssueFilter');
const issueFilterNote = document.getElementById('issueFilterNote');

function updateIssueClearVisibility() {
  if (selectedIssue) {
    clearIssueFilterBtn.classList.remove('hidden');
  } else {
    clearIssueFilterBtn.classList.add('hidden');
  }
}

const labelMap = {
  gpt_script_missing: 'GPT script missing',
  gpt_loaded_but_not_initialized: 'GPT loaded but not initialized',
  gpt_no_slot_requests: 'No GPT slot requests',
  wrong_network: 'Incorrect ad network ID',
  slot_not_registered: 'DOM slot not in GPT',
  defined_without_dom_no_request: 'GPT slot defined without DOM',
  requested_slot_missing_dom: 'Requested GPT slot missing DOM',
  unexpected_size: 'Unexpected size',
  empty_response: 'No ad response returned',
  slot_never_requested: 'Slot visible but no ad request sent',
  layout_overlap: 'Layout overlap',
  ad_visibility_impaired: 'Ad visibility impaired',
  slot_container_collapsed: 'Slot container collapsed',
  token_invalid: 'Invalid security token',
  clientId_mismatch: 'Client ID mismatch',
  expectedNetworkId_mismatch: 'Network configuration mismatch',
  unauthorized_domain: 'Unauthorized domain access'
};
const ISSUE_GROUPS = {
  DELIVERY: [
    'gpt_script_missing',
    'gpt_loaded_but_not_initialized',
    'gpt_no_slot_requests',
    'empty_response',
    'requested_slot_missing_dom',
    'defined_without_dom_no_request',
    'slot_not_registered',
    'slot_never_requested',
    'wrong_network'
  ],
  LAYOUT: [
    'unexpected_size',
    'layout_overlap',
    'ad_visibility_impaired',
    'slot_container_collapsed'
  ]
};

    const ISSUE_LABEL = {
  wrong_network: 'Wrong network · Configuration mismatch',
  slot_not_registered: 'DOM slot not in GPT · No ad request',
  requested_slot_missing_dom: 'Requested GPT slot missing DOM container · Delivery risk',
  defined_without_dom_no_request: 'Slot defined but not requested · No ad request',
  unexpected_size: 'Unexpected ad size · Rendering mismatch',
  empty_response: 'Empty response · No eligible demand',
  layout_overlap: 'Layout overlap detected',
  ad_visibility_impaired: 'Ad visibility impaired (content obstructing ad)',
  slot_container_collapsed: 'Slot container collapsed · Rendered but zero height',
  gpt_script_missing: 'GPT script missing · Ad serving not possible',
  gpt_loaded_but_not_initialized: 'GPT loaded but not initialized · Ad stack not activated',
  gpt_no_slot_requests: 'No GPT slot requests detected · Delivery halted',
  slot_never_requested: 'Slot visible but no ad request sent · Delivery failure'
};


function buildIssueDropdown(issueCounts) {

  const select = document.getElementById('issueFilter');
  select.innerHTML = `<option value="">All Incident Types</option>`;

  Object.entries(ISSUE_GROUPS).forEach(([groupKey, issues]) => {

    const groupHeader = document.createElement('option');
    const groupTitles = {
  DELIVERY: '— Delivery & Rendering —',
  LAYOUT: '— Layout & Visibility —'
};

groupHeader.textContent = groupTitles[groupKey];
    groupHeader.disabled = true;
    if (groupKey === 'DELIVERY') {
  groupHeader.style.color = '#6366f1';
  groupHeader.style.fontWeight = '600';
}

if (groupKey === 'LAYOUT') {
  groupHeader.style.color = '#d97706';
  groupHeader.style.fontWeight = '600';
}

    select.appendChild(groupHeader);

    issues.forEach(issueKey => {

      const label = labelMap[issueKey];
      if (!label) return;

      const count = issueCounts[issueKey] || 0;

      const option = document.createElement('option');
      option.value = issueKey;
      option.textContent = `${label} (${count})`;
      if (count === 0) {
      option.disabled = true;
      option.style.color = '#9ca3af';
}

      select.appendChild(option);

    });

  });
}

document.getElementById('issueFilter')
  .addEventListener('change', e => {
    selectedIssue = e.target.value;

const url = new URL(window.location);

if (selectedIssue) {
  url.searchParams.set('issue', selectedIssue);
} else {
  url.searchParams.delete('issue');
}

window.history.replaceState({}, '', url);
syncOverviewLink();
if (selectedIssue) {
  const label = labelMap[selectedIssue] || selectedIssue;
  issueFilterNote.textContent = `Showing impact: ${label}`;
  issueFilterNote.classList.remove('hidden');
} else {
  issueFilterNote.classList.add('hidden');
}

updateIssueClearVisibility();
loadExplorerData();
  });

function loadExplorerData() {

  document.getElementById('pageList').innerHTML = `
    <div class="text-sm text-gray-400">
      Loading incidents...
    </div>
  `;

  const explorerParams = new URLSearchParams({
    token: token,
    view: 'dashboard-explorer-data'
  });

  if (activeDate) explorerParams.set('date', activeDate);
  else if (rangeStart && rangeEnd) {
    explorerParams.set('start',rangeStart);
    explorerParams.set('end',rangeEnd);
  }

  if (selectedIssue) {
    explorerParams.set('issue', selectedIssue);
  }

  fetch(`${SHEET_URL}?${explorerParams.toString()}`)
    .then(r => r.json())
    .then(j => {

      if (j.error) throw new Error(j.error);
      if (rangeStart && rangeEnd &&
          (j.start !== rangeStart || j.end !== rangeEnd))
        throw new Error('Date-range reporting backend has not been deployed.');

      buildIssueDropdown(j.issueCounts || {});

      if (
        selectedIssue &&
        !(j.issueCounts || {})[selectedIssue]
      ) {
        selectedIssue = '';
        document.getElementById('issueFilter').value = '';
      }

      if (selectedIssue) {
        document.getElementById('issueFilter').value = selectedIssue;

        const label =
          labelMap[selectedIssue] || selectedIssue;

        issueFilterNote.textContent =
          `Showing impact: ${label}`;

        issueFilterNote.classList.remove('hidden');
      } else {
        issueFilterNote.classList.add('hidden');
      }

      document.getElementById('issueFilter').disabled =
        Object.keys(j.issueCounts || {}).length === 0;

      currentPageMap = new Map(
        (j.pages || []).map(page => [
          page.pageUrl,
          page
        ])
      );

      renderSidebar(currentPageMap);

      if (pendingExplorerPage) {
        const requestedPage = pendingExplorerPage;
        pendingExplorerPage = '';
        const normalize = value => String(value || '').replace(/\/$/, '');
        const pageKey = currentPageMap.has(requestedPage)
          ? requestedPage
          : [...currentPageMap.keys()].find(key =>
              normalize(key) === normalize(requestedPage));

        if (pageKey) {
          const element = [...document.querySelectorAll(
            '#pageList > div[data-apg-page]'
          )].find(el => el.getAttribute('data-apg-page') === pageKey);
          // Also works when the page isn't among the first 100 sidebar items.
          selectPageByUrl(pageKey, element || null);
        } else {
          const notice = document.createElement('div');
          notice.className = 'text-xs text-amber-600 dark:text-amber-400 py-2';
          notice.textContent = 'Selected page not found for this date range.';
          document.getElementById('pageList').prepend(notice);
        }
      }

      updateIssueClearVisibility();
    })
    .catch(error => {

      console.error(
        'Explorer fetch error:',
        error
      );

      document.getElementById('pageList').innerHTML = `
        <div class="text-sm text-red-400">
          Failed to load incidents
        </div>
      `;
    });
}
  
loadExplorerData();

}

const darkModeBtn = document.getElementById('darkModeBtn');
const modeLabel = document.getElementById('modeLabel');

if (localStorage.getItem('theme') === 'dark') {

modeLabel.textContent =

clearIssueFilterBtn.addEventListener('click', () => {

  const url = new URL(window.location);

function renderSidebar(pageMap) {

  const container = document.getElementById('pageList');

  const sortedAll = Array.from(pageMap.entries())
    .sort(
      (a, b) =>
        Number(b[1].sidebarTotal || 0) -
        Number(a[1].sidebarTotal || 0)
    );

  const sorted = sortedAll.slice(0, 100);

  if (!sorted.length) {
    container.innerHTML = `
      <div class="text-sm text-gray-400">
        No pages with incidents
      </div>
    `;
    return;
  }

  container.innerHTML = sorted.map(([page, data]) => {

    const displayPage = page
      .replace(/^https?:\/\/(www\.)?/, '')
      .replace(/\/$/, '')
      .slice(0, 50);

    return `
      <div onclick="selectPage('${btoa(page)}', this)"
           data-apg-page="${apgEscapeHtml(page)}"
           class="cursor-pointer p-3.5 rounded-xl
                  bg-white dark:bg-darkcard
                  border border-gray-200 dark:border-gray-700/50
                  hover:border-indigo-400/40
                  hover:bg-indigo-500/10 dark:hover:bg-indigo-400/10
                  hover:shadow-sm
                  transition">

        <div class="text-xs text-gray-500 uppercase tracking-wide font-medium">
          Page
        </div>

        <div class="text-sm
                    text-indigo-400 hover:text-indigo-300
                    break-all transition"
             title="${apgEscapeHtml(page)}">
          ${apgEscapeHtml(displayPage)}
        </div>

        <div class="text-sm mt-1 font-semibold text-red-500 dark:text-[#ef4444]/80 tabular-nums">
          $${Number(data.sidebarTotal || 0).toFixed(2)}
        </div>

      </div>
    `;
  }).join('');

  if (sortedAll.length > sorted.length) {
    container.innerHTML += `
      <div class="text-xs text-gray-400 text-center py-3">
        Showing top ${sorted.length} pages by estimated impact out of ${sortedAll.length}.
        Use date or incident filter to narrow results.
      </div>
    `;
  }
}

function selectPage(encodedPage, el) {
  selectPageByUrl(atob(encodedPage), el);
}
function selectPageByUrl(page, el) {

  document.querySelectorAll('#pageList > div')
  .forEach(d => d.classList.remove(
    'border-indigo-400',
    'bg-indigo-500/15',
    'dark:bg-indigo-400/10'
  ));

  if (el) {
    el.classList.add(
  'border-indigo-400',
  'bg-indigo-500/15',
  'dark:bg-indigo-400/10',
  'scale-[0.98]'
);
setTimeout(() => {
  el.classList.remove('scale-[0.98]');
}, 120);
  }

  const data = currentPageMap.get(page);

  if (!data) return;

  renderDetails(page, data);

  const panel = document.getElementById('detailsContent');
  const overlay = document.getElementById('overlay');
  panel.classList.remove('translate-x-full', 'opacity-0');
  overlay.classList.remove('opacity-0', 'pointer-events-none');
}
function renderDetails(page, data) {

  const container =
    document.getElementById('detailsContent');

  const pageRevenue =
    Number(data.totalImpact || 0);

  const issues =
    Array.isArray(data.issues)
      ? data.issues
      : [];

  container.innerHTML = `
    <div class="flex justify-between items-start mb-6">

      <div>
        <div class="text-[11px] text-gray-500 dark:text-gray-400 uppercase tracking-wide font-medium">
          Page
        </div>

        <a href="${apgSafeHref(page)}" rel="noopener noreferrer" target="_blank"
           class="text-sm font-semibold text-indigo-600 hover:text-indigo-700 hover:underline break-all">
          ${apgEscapeHtml(page)}
        </a>
      </div>

      <div class="flex items-start gap-4">

        <div class="text-right">
          <div class="text-xs text-gray-400 uppercase tracking-wide">
            Total impact
          </div>

          <div class="text-2xl font-semibold text-red-600 dark:text-[#ef4444]/80 tabular-nums">
            $${pageRevenue.toFixed(2)}
          </div>
        </div>

        <button onclick="closePanel()"
                class="text-gray-400 hover:text-gray-600 text-lg mt-1">
          ✕
        </button>

      </div>

    </div>

    ${issues.map(issueData => {

      const issue =
        issueData.issueType || 'unknown';

      const severity =
        String(
          issueData.severity || 'INFO'
        ).toUpperCase();

      const percent =
        Number(issueData.percent || 0);

      const impact =
        Number(issueData.impact || 0);

      const slots =
        Array.isArray(issueData.slots)
          ? issueData.slots
          : [];
      
      // The Explorer displays the slots actually listed for each
      // slot-level signal, including INFO/LOW. Sheet's affectedSlotCount
      // intentionally stays zero for non-KPI signals, so do not use it here.
      const isGlobalIssue = [
        'gpt_script_missing',
        'gpt_loaded_but_not_initialized',
        'gpt_no_slot_requests'
      ].includes(issue);
      const affectedSlotCount = isGlobalIssue
        ? Number(issueData.affectedSlotCount || 0)
        : new Set(slots.filter(slot =>
            typeof slot === 'string' &&
            slot.trim() &&
            slot !== '__global__'
          )).size;
      const suggestedChecks =
        Array.isArray(issueData.suggestedChecks)
          ? issueData.suggestedChecks
          : [];

      const fullLabel =
        (typeof issueData.displayLabel === 'string' && issueData.displayLabel.trim()) ||
        ISSUE_LABEL[issue] ||
        labelMap[issue] ||
        issue;

      const [firstPart, ...remainingParts] =
        fullLabel.split('·');

      // For missing-DOM incidents, lead with the actual failure and
      // place the GPT request/response state beneath it.
      const isEvidenceSpecificMissingDom =
        issue === 'requested_slot_missing_dom' &&
        (firstPart.trim() === 'Ad returned' ||
         firstPart.trim() === 'Ad requested') &&
        remainingParts.length >= 2;

      const title = isEvidenceSpecificMissingDom
        ? remainingParts.join('·').trim()
        : firstPart.trim();

      const subtext = isEvidenceSpecificMissingDom
        ? firstPart.trim()
        : remainingParts.join('·').trim();

      const checksId =
        btoa(issue + '|' + severity + '|' + page);

      return `
        <div data-severity="${apgEscapeHtml(severity)}"
          class="apg-incident-card mb-5 p-4 rounded-xl border-l-4
          ${severity === 'HIGH'
            ? 'border-l-red-500/80'
            : severity === 'MEDIUM'
            ? 'border-l-orange-400/80'
            : 'border-l-gray-400/60'}
          border-gray-200 dark:border-gray-700/50
          hover:shadow-md transition">

          <div class="flex justify-between items-start">

            <div class="flex items-start gap-2">
              <div>

                <div>
                  <div class="flex items-center justify-between gap-2">

                    <div class="font-semibold text-gray-900 dark:text-gray-100 text-[15px]">
                      ${apgEscapeHtml(title.trim())}
                    </div>

                    <span class="text-[11px] px-2 py-0.5 rounded
                      ${severity === 'HIGH'
                        ? 'bg-red-500/10 text-red-500'
                        : severity === 'MEDIUM'
                        ? 'bg-orange-400/10 text-orange-400'
                        : 'bg-gray-500/10 text-gray-400'}">
                      ${percent}%
                    </span>

                  </div>

                  ${
                    subtext
                      ? `
                        <div class="text-sm text-gray-500 dark:text-gray-400">
                          ${apgEscapeHtml(subtext)}
                        </div>
                      `
                      : ''
                  }

                </div>

                <div class="text-sm text-gray-500 mt-1">
                  ${affectedSlotCount} affected slots
                </div>

                <div class="mt-2 text-xs text-gray-500">
                  <ul class="space-y-1">
                    ${slots
                      .map(s => `<li>• ${apgEscapeHtml(s)}</li>`)
                      .join('')}
                  </ul>
                </div>

              </div>
            </div>

            <div class="text-right">

              <div class="text-xs text-gray-400 uppercase tracking-wide">
                Impact
              </div>

              <div class="text-xl font-semibold text-red-600 dark:text-[#ef4444]/80 tabular-nums">
                $${impact.toFixed(2)}
              </div>

            </div>

          </div>

          <div class="mt-4">

            <button
              onclick="toggleChecks('${checksId}')"
              class="text-sm font-medium
                     text-indigo-400 hover:text-indigo-300
                     transition">
              🔎 Show suggested checks
            </button>

            <div id="checks-${checksId}"
                 class="hidden mt-2 bg-gray-50 dark:bg-gray-800/40
                        border border-gray-200 dark:border-gray-700
                        rounded-lg p-3.5">

              <div class="text-gray-500 dark:text-gray-400 text-[11px] mb-2 font-semibold uppercase tracking-wide">
                💡 Suggested checks:
              </div>

              <ul class="space-y-1 text-gray-600 dark:text-gray-300 text-sm leading-relaxed">
                ${suggestedChecks
                  .map(c => `<li>• ${apgEscapeHtml(c)}</li>`)
                  .join('')}
              </ul>

            </div>

          </div>

        </div>
      `;
    }).join('')}
  `;
}
function closePanel() {
  const panel = document.getElementById('detailsContent');
  const overlay = document.getElementById('overlay');

  panel.classList.add('translate-x-full', 'opacity-0');
  overlay.classList.add('opacity-0', 'pointer-events-none');
}
  document.getElementById('overlay')
  .addEventListener('click', closePanel);
  document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closePanel();
  }
});
</script>
